<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WHISP report</title>
<style>
:root,[data-theme="light"]{--bg:#f4f6f3;--surface:#fff;--raised:#eef1eb;--border:#d0d9c8;--text:#1e2a14;--muted:#637055;--accent:#4c7e0b;--low:#4c7e0b;--mid:#e09a1a;--high:#e05a5a}
[data-theme="dark"]{--bg:#0e1112;--surface:#161b1e;--raised:#1e2428;--border:#2a3035;--text:#e8eaeb;--muted:#8a9aa0;--accent:#7dc00d;--low:#7dc00d;--mid:#e09a1a;--high:#f87171}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
h1{margin:0;font-size:15px;font-weight:600}
.meta{color:var(--muted);font-size:12px}
.chip{border:1px solid var(--border);background:var(--raised);color:var(--accent);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:500}
.bar-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:inline-flex;gap:1px;background:var(--border);border-radius:3px;overflow:hidden}
.tabs button{border:0;background:var(--surface);color:var(--muted);padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--raised);color:var(--text);font-weight:600}
button.btn{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:3px;height:30px;padding:0 10px;font:inherit;font-size:12px;cursor:pointer}
button.btn:hover{background:var(--raised);color:var(--text)}
button.btn:disabled{opacity:.4;cursor:default}
main{max-width:960px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:20px}
section{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:16px}
h2{margin:0 0 8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hint{margin:0 0 10px;font-size:11px;color:var(--muted)}
.risks{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:3px;overflow:hidden}
.risk{border:0;background:var(--surface);padding:14px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.risk:hover,.risk.on{background:var(--raised)}
.risk .lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%}
.dot.low{background:var(--low)}.dot.mid{background:var(--mid)}.dot.high{background:var(--high)}
.risk .n{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
.risk .n.low{color:var(--low)}.risk .n.mid{color:var(--mid)}.risk .n.high{color:var(--high)}
.inds{display:grid;grid-template-columns:1fr;gap:4px 12px}
@media(min-width:560px){.inds{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ind{min-width:0;cursor:pointer;padding:6px 8px;border-radius:3px}
.ind:hover,.ind.on{background:var(--raised)}
.ind-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:4px}
.ind-lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.ind.on .ind-lbl,.ind:hover .ind-lbl{color:var(--text);font-weight:500}
.bar{height:2px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--muted)}
.bar>i.low{background:var(--low)}.bar>i.mid{background:var(--mid)}.bar>i.high{background:var(--high)}
.tree-step{margin:0}
.tree-row{display:flex;align-items:center;gap:12px}
.tree-q{min-width:0;flex:1;border:1px solid var(--border);background:var(--surface);padding:8px 12px;font-size:12px;font-weight:500;border-radius:3px}
.tree-side{display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:11px;color:var(--muted)}
.tree-down{display:flex;align-items:center;gap:6px;padding:6px 0 6px 12px;font-size:11px;color:var(--muted)}
.tree-line{width:1px;height:16px;border-left:1px dashed var(--border)}
.tree-lbl{text-transform:uppercase;letter-spacing:.04em;opacity:.7}
.tree-arr{opacity:.5}
.tree-n{font-variant-numeric:tabular-nums}
.out{font-weight:600}.out.low{color:var(--low)}.out.mid{color:var(--mid)}.out.high{color:var(--high)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:3px;max-height:60vh}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--border);padding:7px 12px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--raised);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
td{color:var(--muted)}
tr.plot{cursor:pointer}
tr.plot:hover td,tr.plot.open td{background:var(--raised)}
tr.detail td{white-space:normal;background:var(--bg);padding:12px}
.details{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
.details>div{min-width:0}
.details b{display:block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px;overflow-wrap:anywhere;word-break:break-word}
.details>div>div{overflow-wrap:anywhere;word-break:break-word}
.yes{color:var(--accent);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:500}
.badge.low{background:color-mix(in srgb,var(--low) 14%,transparent);color:var(--low)}
.badge.mid{background:color-mix(in srgb,var(--mid) 14%,transparent);color:var(--mid)}
.badge.high{background:color-mix(in srgb,var(--high) 14%,transparent);color:var(--high)}
.filter{display:none;align-items:center;height:28px;border:1px solid var(--border);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);border-radius:3px;padding:0 10px;font-size:11px;cursor:pointer}
.filter.show{display:inline-flex}
@media (max-width:700px){.risks{grid-template-columns:1fr}}
</style>
</head>

<script>
(function () {
  var report = JSON.parse(document.getElementById('data').textContent);
  var commodity = report.commodities[0].key;
  var riskFilter = null;
  var indFilter = null;
  var page = 1;
  var pageSize = 10;
  var openId = null;
  var tones = [
    { k: 'low', v: 'low', label: 'Low risk', mix: 'low' },
    { k: 'mid', v: 'more_info_needed', label: 'More info needed', mix: 'medium' },
    { k: 'high', v: 'high', label: 'High risk', mix: 'high' }
  ];
  var toneOf = { low: 'low', high: 'high', more_info_needed: 'mid' };
  var outLabel = { low: 'Low', high: 'High', more_info_needed: 'More info', continue: 'continue' };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function isYes(v) {
    return v === true || (typeof v === 'string' && (v.toLowerCase() === 'yes' || v.toLowerCase() === 'true'));
  }
  function cur() {
    for (var i = 0; i < report.commodities.length; i++) {
      if (report.commodities[i].key === commodity) return report.commodities[i];
    }
    return report.commodities[0];
  }
  function filtered() {
    var c = cur();
    return report.rows.filter(function (r) {
      if (riskFilter && String(r[c.riskField] || '') !== riskFilter) return false;
      if (indFilter && !isYes(r[indFilter])) return false;
      return true;
    });
  }
  function badge(v) {
    var t = toneOf[v];
    if (!t) return esc(v == null ? '-' : v);
    var label = v === 'more_info_needed' ? 'More info needed' : v === 'high' ? 'High' : 'Low';
    return '<span class="badge ' + t + '"><span class="dot ' + t + '"></span>' + label + '</span>';
  }
  function cell(key, v) {
    if (v == null || v === '') return '-';
    if (key.indexOf('risk_') === 0) return badge(String(v));
    if (isYes(v)) return '<span class="yes">yes</span>';
    if (v === false || String(v).toLowerCase() === 'no') return 'no';
    return esc(v);
  }
  function filterLabel() {
    var c = cur();
    if (riskFilter) {
      for (var i = 0; i < tones.length; i++) if (tones[i].v === riskFilter) return c.label + ' · ' + tones[i].label;
    }
    if (!indFilter) return '';
    for (var j = 0; j < c.indicators.length; j++) {
      if (c.indicators[j].key === indFilter) return c.indicators[j].label + ' · yes';
    }
    var other = report.otherIndicators || [];
    for (var k = 0; k < other.length; k++) {
      if (other[k].key === indFilter) return other[k].label + ' · yes';
    }
    return '';
  }
  function indHtml(list) {
    return '<div class="inds">' + list.map(function (ind) {
      var pct = ind.total ? Math.round((ind.yes / ind.total) * 100) : 0;
      var tone = ind.yesTone === 'high' ? 'high' : ind.yesTone === 'low' ? 'low' : ind.yesTone ? 'mid' : '';
      return '<div class="ind' + (indFilter === ind.key ? ' on' : '') + '" data-i="' + esc(ind.key) + '" title="' + esc(ind.label) + '">' +
        '<div class="ind-top"><span class="ind-lbl">' + esc(ind.label) + '</span><span>' + ind.yes + '/' + ind.total + '</span></div>' +
        '<div class="bar"><i class="' + tone + '" style="width:' + pct + '%"></i></div></div>';
    }).join('') + '</div>';
  }
  function hit(e, attr) {
    var n = e.target;
    while (n && n !== e.currentTarget) {
      if (n.getAttribute && n.getAttribute(attr) != null) return n;
      n = n.parentNode;
    }
    return null;
  }
  function reset() { page = 1; openId = null; }
  function render() {
    var c = cur();
    document.getElementById('tabs').innerHTML = report.commodities.map(function (x) {
      return '<button type="button" class="' + (x.key === commodity ? 'on' : '') + '" data-c="' + esc(x.key) + '">' + esc(x.label) + '</button>';
    }).join('');
    var fl = filterLabel();
    var fel = document.getElementById('filter');
    fel.className = fl ? 'filter show' : 'filter';
    fel.textContent = fl ? fl + ' x' : '';
    document.getElementById('risks').innerHTML = tones.map(function (t) {
      return '<button type="button" class="risk' + (riskFilter === t.v ? ' on' : '') + '" data-r="' + t.v + '">' +
        '<div class="lbl"><span class="dot ' + t.k + '"></span>' + esc(t.label) + '</div>' +
        '<div class="n ' + t.k + '">' + (c.mix[t.mix] || 0) + '</div></button>';
    }).join('');
    document.getElementById('inds').innerHTML = c.indicators.length ? indHtml(c.indicators) : '<p class="meta">No indicators</p>';
    var other = report.otherIndicators || [];
    document.getElementById('other').style.display = other.length ? '' : 'none';
    if (other.length) document.getElementById('other-inds').innerHTML = indHtml(other);
    document.getElementById('tree').innerHTML = (c.tree && c.tree.length) ? c.tree.map(function (step, i) {
      var yes = { side: 'yes', out: step.yesOutcome, n: step.yesCount };
      var no = { side: 'no', out: step.noOutcome, n: step.noCount };
      var down = yes;
      var right = no;
      if (step.yesOutcome === 'continue') { down = yes; right = no; }
      else if (step.noOutcome === 'continue') { down = no; right = yes; }
      function outHtml(out) {
        if (out === 'continue') return '<span>continue</span>';
        return '<span class="out ' + (toneOf[out] || '') + '">' + esc(outLabel[out] || out) + '</span>';
      }
      var rightHtml = right.out === 'continue' ? '' :
        '<div class="tree-side"><span class="tree-lbl">' + right.side + '</span><span class="tree-arr">&#8594;</span>' +
        outHtml(right.out) + '<span class="tree-n">(' + right.n + ' plot' + (right.n === 1 ? '' : 's') + ')</span></div>';
      var isLast = i === c.tree.length - 1;
      var downHtml = (!isLast || down.out !== 'continue')
        ? '<div class="tree-down"><span class="tree-line"></span><span class="tree-lbl">' + down.side + '</span><span class="tree-arr">&#8595;</span>' +
          outHtml(down.out) + '<span class="tree-n">(' + down.n + ' plot' + (down.n === 1 ? '' : 's') + ')</span></div>'
        : '';
      return '<div class="tree-step"><div class="tree-row"><div class="tree-q">' + esc(step.question) + '</div>' + rightHtml + '</div>' + downHtml + '</div>';
    }).join('') : '<p class="meta">No path</p>';
    var cols = report.summaryColumns;
    var list = filtered();
    var pages = Math.max(1, Math.ceil(list.length / pageSize));
    if (page > pages) page = pages;
    if (page < 1) page = 1;
    var rows = list.slice((page - 1) * pageSize, page * pageSize);
    document.getElementById('shown').textContent = list.length + ' / ' + report.rows.length;
    document.getElementById('page').textContent = page + ' / ' + pages;
    document.getElementById('prev').disabled = page <= 1;
    document.getElementById('next').disabled = page >= pages;
    document.getElementById('thead').innerHTML = '<tr>' + cols.map(function (col) {
      return '<th>' + esc(col.header) + '</th>';
    }).join('') + '</tr>';
    document.getElementById('tbody').innerHTML = rows.map(function (r) {
      var id = String(r.plotId == null ? '' : r.plotId);
      var open = openId === id;
      var tr = '<tr class="plot' + (open ? ' open' : '') + '" data-plot="' + esc(id) + '">' +
        cols.map(function (col) { return '<td>' + cell(col.key, r[col.key]) + '</td>'; }).join('') + '</tr>';
      if (!open) return tr;
      return tr + '<tr class="detail"><td colspan="' + cols.length + '"><div class="details">' +
        report.columns.map(function (col) {
          return '<div><b>' + esc(col.header) + '</b><div>' + cell(col.key, r[col.key]) + '</div></div>';
        }).join('') + '</div></td></tr>';
    }).join('');
  }

  document.getElementById('title').textContent = report.title || 'WHISP report';
  document.getElementById('count').textContent = report.plotCount + ' plots';
  document.getElementById('meta').textContent = 'Exported ' + new Date(report.exportedAt).toLocaleString();

  document.getElementById('tabs').onclick = function (e) {
    var t = hit(e, 'data-c'); if (!t) return;
    commodity = t.getAttribute('data-c'); riskFilter = null; indFilter = null; reset(); render();
  };
  document.getElementById('risks').onclick = function (e) {
    var t = hit(e, 'data-r'); if (!t) return;
    var v = t.getAttribute('data-r');
    indFilter = null; riskFilter = riskFilter === v ? null : v; reset(); render();
  };
  function onInd(e) {
    var t = hit(e, 'data-i'); if (!t) return;
    var k = t.getAttribute('data-i');
    riskFilter = null; indFilter = indFilter === k ? null : k; reset(); render();
  }
  document.getElementById('inds').onclick = onInd;
  document.getElementById('other-inds').onclick = onInd;
  document.getElementById('filter').onclick = function () {
    riskFilter = null; indFilter = null; reset(); render();
  };
  document.getElementById('prev').onclick = function () { openId = null; page -= 1; render(); };
  document.getElementById('next').onclick = function () { openId = null; page += 1; render(); };
  document.getElementById('tbody').onclick = function (e) {
    var t = hit(e, 'data-plot'); if (!t) return;
    var id = t.getAttribute('data-plot');
    openId = openId === id ? null : id;
    render();
  };
  document.getElementById('csv').onclick = function () {
    var cols = report.columns;
    var list = filtered();
    var nl = String.fromCharCode(10);
    var cr = String.fromCharCode(13);
    function csvEsc(v) {
      var s = v == null ? '' : String(v);
      if (s.indexOf('"') >= 0 || s.indexOf(',') >= 0 || s.indexOf(nl) >= 0 || s.indexOf(cr) >= 0) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }
    var lines = [cols.map(function (c) { return csvEsc(c.header); }).join(',')];
    for (var i = 0; i < list.length; i++) lines.push(cols.map(function (c) { return csvEsc(list[i][c.key]); }).join(','));
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join(nl)], { type: 'text/csv;charset=utf-8' }));
    a.download = 'whisp-plots.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  };
  render();
})();
</script>
